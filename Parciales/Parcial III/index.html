<!DOCTYPE html>

<!-- 
// ================================================
//Enlace: https://npc-brain.vercel.app/
// ================================================
-->

<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motor de Decisiones — NPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="npc-styles.css" />
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app"> 

    <header class="app-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="url(#logoGrad)"/>
          <circle cx="14" cy="11" r="4" stroke="#fff" stroke-width="1.8"/>
          <path d="M7 22c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#a78bfa"/>
              <stop offset="1" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
        <span>NPCBrain</span>
      </div>
      <div class="header-badge">
        <span class="dot"></span>
        Motor Activo
      </div>
    </header>

    <section class="hero-section">
      <div class="accion-label">Decisión del NPC</div>
      <div class="accion-display" id="accion-display">—</div>
      <div class="accion-sub" id="accion-sub"></div>
    </section>

    <div class="main-grid">

      <div class="panel inputs-panel">
        <div class="panel-title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 8h12M8 2v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Estado del entorno
        </div>

        <div class="input-group">
          <label>Distancia al jugador</label>
          <div class="input-wrap">
            <input type="number" id="distancia" placeholder="ej: 15" min="0" />
            <span class="input-unit">m</span>
          </div>
        </div>

        <div class="input-group">
          <label>Salud del robot</label>
          <div class="input-wrap">
            <input type="number" id="salud" placeholder="ej: 80" min="0" max="100" />
            <span class="input-unit">%</span>
          </div>
        </div>

        <div class="input-group">
          <label>Munición</label>
          <div class="input-wrap">
            <input type="number" id="municion" placeholder="ej: 10" min="0" />
            <span class="input-unit">rds</span>
          </div>
        </div>

        <button class="btn btn-evaluar" id="btn-evaluar">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M5 3l7 4.5L5 12V3z" fill="currentColor"/>
          </svg>
          Evaluar
        </button>

        <button class="btn btn-random" id="btn-random">
  <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
    <path d="M2 5h8M2 10h8M10 3l3 2-3 2M10 8l3 2-3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Datos aleatorios
</button>

        <hr class="section-sep" />

        <div class="panel-title" style="margin-bottom: 10px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M2 8h8M2 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Casos de prueba
        </div>

        <div class="frames-list">
          <button class="frame-btn" data-d="50" data-s="100" data-m="10">Frame 001</button>
          <button class="frame-btn" data-d="15" data-s="100" data-m="10">Frame 002</button>
          <button class="frame-btn" data-d="10" data-s="100" data-m="0">Frame 003</button>
          <button class="frame-btn" data-d="5"  data-s="25"  data-m="0">Frame 004</button>
          <button class="frame-btn" data-d="30" data-s="25"  data-m="5">Frame 005</button>
        </div>

      </div>

      <div class="panel tree-panel">
        <div class="panel-title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="2.5" r="1.5" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="3" cy="10" r="1.5" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="13" cy="10" r="1.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 4v2M8 6l-5 2.5M8 6l5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Árbol de decisión
        </div>
        <div class="tree-wrap" id="tree-wrap"></div>
      </div>

    </div>

    <div class="panel log-panel">
      <div class="panel-title">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 4h12M2 8h8M2 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Registro de evaluaciones
        <button class="clear-btn" id="btn-clear">Limpiar</button>
      </div>
      <div class="log-list" id="log-list"></div>
    </div>

  </div>

  <script src="arbol.js"></script>
  <script src="npc.js"></script>
  
</body>
</html>
